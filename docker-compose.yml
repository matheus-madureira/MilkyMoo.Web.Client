services:
  milkymoo:
    # Troque "seu-usuario" pelo seu usuario do Docker Hub antes de publicar.
    image: seu-usuario/milkymoo:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: milkymoo
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"

    # Endurecimento: o conteudo e 100% estatico, o container nao precisa
    # escrever em lugar nenhum alem dos diretorios temporarios do nginx.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
