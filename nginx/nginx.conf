server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- Tipos MIME -----------------------------------------------------
    # Carrega a tabela padrao e acrescenta o que o Blazor WebAssembly usa.
    include /etc/nginx/mime.types;
    types {
        # `wasm` ja vem no mime.types padrao; `webmanifest` e `dat/blat` nao.
        application/manifest+json webmanifest;
        application/octet-stream  dat blat;
    }
    default_type application/octet-stream;

    # ---- Compressao -----------------------------------------------------
    # O publish do Blazor ja gera os .gz ao lado de cada asset:
    # gzip_static entrega o arquivo pronto em vez de comprimir por request.
    gzip_static on;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/javascript application/json
                    application/manifest+json application/wasm
                    application/octet-stream image/svg+xml
                    font/woff font/woff2;

    # ---- Arquivos que definem qual versao do app carrega: sem cache -----
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /service-worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /service-worker-assets.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- Runtime .NET: nomes com fingerprint, cache imutavel ------------
    # `^~` garante precedencia sobre a regex de estaticos abaixo
    # (senao blazor.webassembly.<hash>.js cairia na regra generica).
    location ^~ /_framework/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /_content/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Simbolos de debug nao vao para producao ------------------------
    location ~* \.(?:pdb|dll\.map|js\.map|css\.map)$ {
        return 404;
    }

    # ---- Demais estaticos -----------------------------------------------
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ---- Roteamento SPA --------------------------------------------------
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
